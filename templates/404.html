{% extends "base.html" %}

{% block title %}Page Not Found - BlurDetect{% endblock %}

{% block content %}
<div style="text-align: center; padding: 80px 20px;">
    <h1 style="font-size: 64px; font-weight: 700; color: #667eea; margin-bottom: 16px;">404</h1>
    <h2 style="font-size: 28px; font-weight: 700; color: #2d3748; margin-bottom: 12px;">Page Not Found</h2>
    <p style="color: #718096; margin-bottom: 30px; font-size: 16px;">The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        <i class="bi bi-house"></i> Go Back Home
    </a>
</div>
{% endblock %}
