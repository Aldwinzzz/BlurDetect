{% extends "base.html" %}

{% block title %}Login - BlurDetect{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card" style="margin-top: -20px;">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">
                    <i class="bi bi-box-arrow-in-right" style="color: #007BFF;"></i> Login to BlurDetect
                </h2>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right"></i> Login
                        </button>
                    </div>
                </form>

                <hr class="my-4">

                <p class="text-center">
                    Don&apos;t have an account?
                    <a href="/auth/register" class="text-decoration-none fw-bold">
                        Register here <i class="bi bi-arrow-right"></i>
                    </a>
                </p>

                <div class="alert alert-info mt-3" role="alert">
                    <i class="bi bi-info-circle"></i> <strong>Note:</strong> You must verify your email before logging in.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
