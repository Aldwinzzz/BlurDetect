{% extends "base.html" %}

{% block title %}Upload Image - BlurDetect{% endblock %}

{% block content %}
<h2 class="mb-4">
    <i class="bi bi-cloud-upload" style="color: #007BFF;"></i> Upload Image for Analysis
</h2>

<div class="card">
    <div class="card-body">
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i> <strong>Supported formats:</strong> PNG, JPG, JPEG, GIF, BMP, WebP (Max 16 MB)
        </div>

        <!-- Drag and Drop Zone -->
        <div id="dropZone" class="border-2 rounded p-5 text-center mb-4" 
             style="border: 2px dashed #007BFF; background: #f8f9fa; cursor: pointer; transition: all 0.3s;">
            <i class="bi bi-image" style="font-size: 3rem; color: #007BFF;"></i>
            <p class="mt-3 mb-2"><strong>Drag & drop your image here</strong></p>
            <p class="text-muted mb-0">or click to select a file</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>

        <!-- Progress Bar -->
        <div id="progressContainer" style="display: none;" class="mb-4">
            <div class="progress" style="height: 25px;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                     role="progressbar" style="width: 0%; font-size: 0.9rem;">0%</div>
            </div>
        </div>

        <!-- Image Preview -->
        <div id="preview" style="display: none;" class="mb-4">
            <label class="form-label"><strong>Image Preview</strong></label>
            <div class="text-center">
                <img id="previewImage" src="" alt="Preview" style="max-width: 100%; max-height: 300px; border-radius: 5px;">
            </div>
        </div>

        <!-- Buttons -->
        <div class="d-grid gap-2 d-sm-flex justify-content-center">
            <button id="analyzeBtn" class="btn btn-primary btn-lg" style="display: none;">
                <i class="bi bi-play-circle"></i> Analyze Image
            </button>
            <button id="clearBtn" class="btn btn-outline-secondary btn-lg" style="display: none;">
                <i class="bi bi-x-circle"></i> Clear
            </button>
        </div>
    </div>
</div>

<script>
let uploadedImageId = null;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const previewImage = document.getElementById('previewImage');
const analyzeBtn = document.getElementById('analyzeBtn');
const clearBtn = document.getElementById('clearBtn');
const progressContainer = document.getElementById('progressContainer');
const progressBar = document.getElementById('progressBar');

// Drag and drop events
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.style.borderColor = '#0056b3';
    dropZone.style.background = '#e7f1ff';
});
dropZone.addEventListener('dragleave', () => {
    dropZone.style.borderColor = '#007BFF';
    dropZone.style.background = '#f8f9fa';
});
dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.borderColor = '#007BFF';
    dropZone.style.background = '#f8f9fa';
    handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

function handleFiles(files) {
    if (files.length === 0) return;
    
    const file = files[0];
    
    // Validate file type
    const allowedTypes = ['image/png', 'image/jpeg', 'image/gif', 'image/bmp', 'image/webp'];
    if (!allowedTypes.includes(file.type)) {
        alert('Invalid file type. Allowed: PNG, JPG, JPEG, GIF, BMP, WebP');
        return;
    }
    
    // Validate file size (16 MB)
    if (file.size > 16 * 1024 * 1024) {
        alert('File size exceeds 16 MB limit.');
        return;
    }
    
    // Show preview
    const reader = new FileReader();
    reader.onload = (e) => {
        previewImage.src = e.target.result;
        preview.style.display = 'block';
        analyzeBtn.style.display = 'inline-block';
        clearBtn.style.display = 'inline-block';
    };
    reader.readAsDataURL(file);
    
    // Upload file
    uploadFile(file);
}

function uploadFile(file) {
    const formData = new FormData();
    formData.append('file', file);
    
    progressContainer.style.display = 'block';
    analyzeBtn.disabled = true;
    
    fetch('/detection/upload', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            uploadedImageId = data.image_id;
            progressBar.style.width = '100%';
            progressBar.textContent = '100%';
            setTimeout(() => {
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
                progressBar.textContent = '0%';
                analyzeBtn.disabled = false;
            }, 1000);
        } else {
            alert('Error: ' + (data.error || 'Unknown error'));
            analyzeBtn.disabled = false;
            progressContainer.style.display = 'none';
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error uploading file');
        analyzeBtn.disabled = false;
        progressContainer.style.display = 'none';
    });
}

analyzeBtn.addEventListener('click', () => {
    if (!uploadedImageId) {
        alert('Please upload an image first');
        return;
    }
    
    analyzeBtn.disabled = true;
    analyzeBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Analyzing...';
    
    window.location.href = `/detection/analyze/${uploadedImageId}`;
});

clearBtn.addEventListener('click', () => {
    fileInput.value = '';
    preview.style.display = 'none';
    analyzeBtn.style.display = 'none';
    clearBtn.style.display = 'none';
    progressContainer.style.display = 'none';
    uploadedImageId = null;
});
</script>
{% endblock %}
